[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"


[project]
name = "option-pricing-toolkit"
version = "0.1.0"
description = "A quantitative finance toolkit for analytical and Monte Carlo option pricing, simulation, and numerical validation"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"

dependencies = [
    "numpy",
    "scipy"
]


[project.optional-dependencies]
dev = [
    "pytest",
    "matplotlib"
]


[project.urls]
Repository = "https://github.com/jessicahe17/quant-option-pricing-toolkit"