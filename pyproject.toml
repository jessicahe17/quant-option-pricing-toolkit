[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"


[project]
name = "option-pricing-toolkit"
version = "0.1.0"
description = "A quantitative option pricing library implemented in Python"
requires-python = ">=3.10"

dependencies = [
    "numpy",
    "scipy",
    "pandas"
]


[project.optional-dependencies]
dev = [
    "pytest",
    "matplotlib"
]